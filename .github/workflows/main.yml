name: Python Kodunu Çalıştır

on: [push, workflow_dispatch] # Kod yüklendiğinde veya manuel tetiklendiğinde çalışır

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri yükle (varsa)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Kodu çalıştır
        run: |
        pip install pandas
        run: python "Yzt Proje 1.02.py"  # Buraya kendi .py dosyanın adını yaz
